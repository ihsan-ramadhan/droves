name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # a manual run has no diff to compare, so verify everything
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            changed="$(git ls-files)"
          else
            base="${BASE:-$BEFORE}"
            # a new branch reports an all-zero before sha; fall back to its root
            if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
              base="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          fi
          printf '%s\n' "$changed"

          match() { printf '%s\n' "$changed" | grep -Eq "$1" && echo true || echo false; }
          # Dart sources, pubspec, bundled assets and this workflow feed every
          # client build; a workflow edit must exercise the builds it changes
          shared='^(lib/|test/|assets/|pubspec\.(yaml|lock)|analysis_options\.yaml|\.github/workflows/ci\.yml)'
          {
            echo "android=$(match "$shared|^android/")"
            echo "web=$(match "$shared|^web/")"
            echo "ios=$(match "$shared|^ios/")"
          } >> "$GITHUB_OUTPUT"

  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test --exclude-tags live

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, analyze-test]
    # release builds prove the toolchain on main; a PR only needs analyze and test
    if: github.event_name != 'pull_request' && needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v7
        with:
          name: droves-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  build-web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, analyze-test]
    if: github.event_name != 'pull_request' && needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /droves/
      - uses: actions/upload-artifact@v7
        with:
          name: droves-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 35
    needs: [changes, analyze-test]
    # no Mac locally, so this is the only check that iOS still compiles
    if: needs.changes.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v7
        with:
          name: droves-ios
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
